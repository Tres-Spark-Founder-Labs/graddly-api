name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Prettier
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      # ts-jest transpiles without type checking and tsconfig.build.json
      # excludes test/, so nothing checked the e2e helpers. A helper that
      # constructs a service by hand then silently drifted from its
      # constructor: PdfGenerationProcessor gained a parameter, the helper
      # kept passing the old count, every argument after the gap shifted one
      # place, and seven e2e suites failed with the processor updating the
      # wrong table. This catches that class in about a second.
      - name: Type-check e2e helpers
        run: yarn typecheck:test-helpers

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run unit tests
        run: yarn test --coverage

  migrations:
    name: DB migrations (apply + show)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graddly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run migrations
        run: yarn typeorm migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Provision application DB role
        run: yarn db:provision-role
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Show migration status
        run: yarn typeorm migration:show
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_NAME: graddly_test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graddly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run migrations
        run: yarn typeorm migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Provision application DB role
        run: yarn db:provision-role
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Show migration status
        run: yarn typeorm migration:show
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_NAME: graddly_test

      - name: Run e2e tests
        run: yarn test:e2e
        env:
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test
          JWT_SECRET: ci-test-jwt-secret
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          THROTTLE_ENABLED: "false"
          TENANT_DB_CONTEXT_ENABLED: "true"
