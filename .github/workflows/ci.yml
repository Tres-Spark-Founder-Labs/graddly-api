name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Prettier
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      # ts-jest transpiles without type checking and tsconfig.build.json
      # excludes test/, so nothing checked the e2e helpers. A helper that
      # constructs a service by hand then silently drifted from its
      # constructor: PdfGenerationProcessor gained a parameter, the helper
      # kept passing the old count, every argument after the gap shifted one
      # place, and seven e2e suites failed with the processor updating the
      # wrong table. This catches that class in about a second.
      - name: Type-check e2e helpers
        run: yarn typecheck:test-helpers

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # F3.1.1 AC2 — the apprentice app's OTJ category list must not drift from
      # the API enum. `otj-categories-contract.spec.ts` reads that list from the
      # frontend repository, which was never checked out here: the spec skipped
      # on every run and reported green, so the gate had never once executed.
      #
      # Checked out *inside* the workspace because `actions/checkout` refuses to
      # write outside it; `GRADLLY_FRONTEND_DIR` points the spec at it.
      #
      # Needs a token that can read the frontend repository — `GITHUB_TOKEN` is
      # scoped to this one. `continue-on-error` keeps a token problem from
      # blocking unrelated work, and the spec still fails loudly because
      # `OTJ_CONTRACT_REQUIRED=true` turns a missing checkout into a failure
      # rather than a silent skip.
      - name: Check out apprentice frontend (for the OTJ category contract)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Tres-Spark-Founder-Labs/gradlly-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: .frontend
          ref: main
          sparse-checkout: |
            apps/apprentice/features/otj/constants
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run unit tests
        env:
          GRADLLY_FRONTEND_DIR: ${{ github.workspace }}/.frontend
          OTJ_CONTRACT_REQUIRED: 'true'
        run: yarn test --coverage


  contract-drift:
    name: Contract drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Security pass item 8. openapi.json is committed so type generation
      # does not need a running API — which means it can go stale, and a
      # stale contract is exactly what the frontend then generates types
      # from. Regenerate and fail on any diff.
      - name: Regenerate OpenAPI document
        run: yarn openapi:emit

      - name: Fail if the committed spec is stale
        run: |
          if ! git diff --quiet -- openapi.json; then
            echo "::error::openapi.json is out of date. Run yarn openapi:emit and commit the result."
            git diff --stat -- openapi.json
            exit 1
          fi
          echo "openapi.json matches the committed version."

  migrations:
    name: DB migrations (apply + show)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graddly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run migrations
        run: yarn typeorm migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Provision application DB role
        run: yarn db:provision-role
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Show migration status
        run: yarn typeorm migration:show
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_NAME: graddly_test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graddly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run migrations
        run: yarn typeorm migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Provision application DB role
        run: yarn db:provision-role
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test

      - name: Show migration status
        run: yarn typeorm migration:show
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_NAME: graddly_test

      - name: Run e2e tests
        run: yarn test:e2e
        env:
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_MIGRATION_USERNAME: postgres
          DB_MIGRATION_PASSWORD: postgres
          DB_USERNAME: graddly_app
          DB_PASSWORD: graddly_app
          DB_NAME: graddly_test
          JWT_SECRET: ci-test-jwt-secret
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          THROTTLE_ENABLED: "false"
          TENANT_DB_CONTEXT_ENABLED: "true"
